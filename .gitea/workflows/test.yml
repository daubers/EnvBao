name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Label of a Linux act_runner; see docs/releasing.md
    runs-on: linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (coverage must stay >= 90%)
        run: uv run pytest --cov --cov-report=term-missing
      - name: Build smoke test
        run: |
          uv run pyinstaller envbao.spec --clean --noconfirm
          ./dist/envbao/envbao --version
          python3 scripts/packaging/build_deb.py 0.0.0 amd64 dist out
